name: Java build, tests and benchmarks
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
      - run: java -cp target/classes Main
      - run: java -cp target/classes Benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-tables
          path: results/tables/
